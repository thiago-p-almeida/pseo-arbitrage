name: ETL Curva A (Alta Frequencia - 4h)

on:
  schedule:
    - cron: '0 */4 * * *' # Executa a cada 4 horas
  workflow_dispatch: # Permite execução manual no painel do GitHub

jobs:
  run-etl-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Executar ETL Curva A (Backoff + Jitter)
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/etl.py --tier A

      - name: Aplicar Batch Update no Cloudflare D1
        if: hashFiles('batch_update.sql') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute pseo-db --remote --file=batch_update.sql
