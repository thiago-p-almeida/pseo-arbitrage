name = "pseo-arbitrage"
compatibility_date = "2025-06-01"
main = "dist/server/entry.mjs"

# Binding do Banco de Dados Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "pseo-db"
database_id = "b86660ea-2b4b-487a-abc6-2415f17d8822"

# Variáveis de Ambiente Públicas
# (As chaves secretas e tokens estão configuradas com segurança diretamente no painel da Cloudflare)
[vars]
SITE_URL = "https://pseo-arbitrage.pages.dev"
DEBUG_MODE = "false"
AMAZON_MARKETPLACE = "www.amazon.com.br"
AMAZON_REGION = "us-east-1"